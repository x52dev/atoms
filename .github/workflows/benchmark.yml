# This workflow is managed by gh actions-lock.

name: Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          toolchain: nightly

      - name: Install cargo-codspeed
        uses: taiki-e/install-action@v2.88.0
        with:
          tool: cargo-codspeed

      - name: Build CPU and memory benchmarks
        run: cargo codspeed build --all-features --locked -m simulation -m memory

      - name: Run CPU and memory benchmarks
        uses: CodSpeedHQ/action@v5.6.1
        env:
          DIVAN_MIN_TIME: "1"
        with:
          mode: simulation,memory
          run: cargo codspeed run
