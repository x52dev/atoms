# This workflow is managed by gh actions-lock.

name: Coverage

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        id: rust
        background: true
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        env:
          LD_LIBRARY_PATH: ""
        with:
          components: llvm-tools
          cache-key: ${{ hashFiles('flake.lock') }}

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Enter Nix devshell
        id: devshell
        background: true
        uses: nicknovitski/nix-develop@v1.2.1

      - name: Wait for Rust
        wait: rust

      - name: Install just, cargo-llvm-cov
        uses: taiki-e/install-action@v2.88.1
        env:
          LD_LIBRARY_PATH: ""
        with:
          tool: just,cargo-llvm-cov

      - name: Wait for Nix devshell
        wait: devshell

      - name: Generate code coverage
        run: just test-coverage-codecov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          files: codecov.json
          fail_ci_if_error: true
        env:
          # Use the runner's libraries for Codecov's system tools.
          LD_LIBRARY_PATH: ""
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
